<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Credential Email Workflow Diagram</title>
  <desc id="desc">Sequence-style workflow for user creation or password reset leading to an API call and SMTP relay delivery.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 28px Segoe UI, Arial, sans-serif; fill: #1f2932; }
      .subtitle { font: 400 14px Segoe UI, Arial, sans-serif; fill: #596874; }
      .lane { stroke: #aeb9c2; stroke-width: 2; fill: none; }
      .head { fill: #ffffff; stroke: #4f6676; stroke-width: 2; rx: 12; }
      .head2 { fill: #eef7f7; stroke: #3f7c7a; stroke-width: 2; rx: 12; }
      .head3 { fill: #fdf1e7; stroke: #b3692d; stroke-width: 2; rx: 12; }
      .step { fill: #ffffff; stroke: #d2d8de; stroke-width: 1.5; rx: 12; }
      .h { font: 700 16px Segoe UI, Arial, sans-serif; fill: #1f2a30; }
      .p { font: 400 12.5px Segoe UI, Arial, sans-serif; fill: #31424d; }
      .note { font: 600 12px Segoe UI, Arial, sans-serif; fill: #38505c; }
      .arrow { stroke: #465965; stroke-width: 2.4; fill: none; marker-end: url(#m); }
      .return { stroke-dasharray: 7 6; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#465965"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text class="title" x="50" y="54">Credential Email Workflow</text>
  <text class="subtitle" x="50" y="82">Runtime sequence from admin action to server-side SMTP delivery.</text>

  <rect class="head" x="55" y="115" width="120" height="56" rx="12"/>
  <text class="h" x="92" y="149">Admin</text>
  <rect class="head" x="235" y="115" width="165" height="56" rx="12"/>
  <text class="h" x="259" y="149">Desktop UI</text>
  <rect class="head" x="460" y="115" width="165" height="56" rx="12"/>
  <text class="h" x="487" y="149">ConfigLoader</text>
  <rect class="head2" x="685" y="115" width="165" height="56" rx="12"/>
  <text class="h" x="722" y="149">MailService</text>
  <rect class="head2" x="910" y="115" width="190" height="56" rx="12"/>
  <text class="h" x="938" y="149">eRx Mail Server API</text>

  <line class="lane" x1="115" y1="171" x2="115" y2="705"/>
  <line class="lane" x1="317" y1="171" x2="317" y2="705"/>
  <line class="lane" x1="542" y1="171" x2="542" y2="705"/>
  <line class="lane" x1="767" y1="171" x2="767" y2="705"/>
  <line class="lane" x1="1005" y1="171" x2="1005" y2="705"/>

  <rect class="step" x="250" y="205" width="135" height="44" rx="12"/>
  <text class="p" x="274" y="232">Create / reset user</text>
  <path class="arrow" d="M 115 227 L 242 227"/>

  <rect class="step" x="470" y="275" width="145" height="52" rx="12"/>
  <text class="p" x="486" y="299">Read mail.server.api</text>
  <text class="p" x="486" y="317">and mail.from</text>
  <path class="arrow" d="M 317 301 L 462 301"/>

  <path class="arrow return" d="M 542 352 L 325 352"/>
  <text class="note" x="373" y="343">config values</text>

  <rect class="step" x="250" y="390" width="135" height="64" rx="12"/>
  <text class="p" x="272" y="414">Build payload</text>
  <text class="p" x="264" y="432">mail_from, mail_to,</text>
  <text class="p" x="274" y="448">subject, body</text>

  <rect class="step" x="700" y="500" width="135" height="52" rx="12"/>
  <text class="p" x="719" y="524">POST form-urlencoded</text>
  <text class="p" x="730" y="542">request</text>
  <path class="arrow" d="M 317 526 L 692 526"/>

  <rect class="step" x="924" y="585" width="162" height="74" rx="12"/>
  <text class="p" x="944" y="609">Relay via SMTP to</text>
  <text class="p" x="934" y="627">corpsmtprelay.walgreens.com</text>
  <text class="p" x="989" y="645">and deliver mail</text>
  <path class="arrow" d="M 767 611 L 916 611"/>

  <path class="arrow return" d="M 1005 690 L 775 690"/>
  <text class="note" x="847" y="681">HTTP success / error</text>
  <path class="arrow return" d="M 767 720 L 325 720"/>
  <text class="note" x="491" y="711">show delivery result to admin</text>
</svg>
