-dontshrink
# ProGuard configuration for Raw-Xml-Data-Puller
# Safety rules: keep all public API (FXML loads controllers by reflection)

-dontoptimize
-dontwarn **

# JDK module library JARs — uses <java.home> variable (handles spaces in path)
-libraryjars '<java.home>/jmods/java.base.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.sql.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.xml.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.desktop.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.logging.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.naming.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.management.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.transaction.xa.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.security.jgss.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.prefs.jmod'(!**.jar;!module-info.class)
-libraryjars '<java.home>/jmods/java.compiler.jmod'(!**.jar;!module-info.class)

# JavaFX JMODs (no spaces in this path)
-libraryjars 'C:/javafx-jmods-21.0.12/javafx.base.jmod'(!**.jar;!module-info.class)
-libraryjars 'C:/javafx-jmods-21.0.12/javafx.graphics.jmod'(!**.jar;!module-info.class)
-libraryjars 'C:/javafx-jmods-21.0.12/javafx.controls.jmod'(!**.jar;!module-info.class)
-libraryjars 'C:/javafx-jmods-21.0.12/javafx.fxml.jmod'(!**.jar;!module-info.class)

# Keep module-info so it survives even if ProGuard touches it
# (moditect will replace it with the final version anyway)
-keep class module-info { *; }

# Keep the entire application package — FXML references classes by name
-keep public class com.walgreens.rawxmldatapuller.** {
    public protected *;
}

# Keep enum constants (used in switch expressions and FXML)
-keepclassmembers enum com.walgreens.rawxmldatapuller.** {
    public static **[] values();
    public static ** valueOf(java.lang.String);
    *;
}

# Keep JDBC driver service-loader registration
-keep class * implements java.sql.Driver { *; }

# Preserve debugging and annotation attributes
-keepattributes Signature, *Annotation*, EnclosingMethod, InnerClasses, SourceFile, LineNumberTable, Module, ModulePackages, ModuleMainClass
